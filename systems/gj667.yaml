system: GJ667
# Canonical internal units after loading: AU, year, M_sun, radian.
reference_frame: mutual        # planet plane = z=0; outer orbit tilts by i_mut
distance_pc: 7.24

bodies:
  AB:                          # A+B collapsed to one point mass = the perturber
    role: perturber
    mass: {value: 1.27, unit: Msun}
    luminosityA: {value: 0.173, unit: Lsun}
    luminosityB: {value: 0.113, unit: Lsun}

  C:                           # host star
    role: host
    mass: {value: 0.327, plus: 0.008, minus: 0.008, unit: Msun}
    luminosity: {value: 0.01439, unit: Lsun}
    orbit:                     # C relative to AB barycentre (outer Jacobi orbit)
      primary: AB
      a:     {value: 235, unit: AU}          # adopted = projected sep (fiducial)
      e:     {sweep: [0.0, 0.2, 0.4, 0.6, 0.8]}
      i:     {sweep: [0, 30, 60, 90], unit: deg, kind: mutual}
      Omega: {value: 0, unit: deg}           # absorbed into reference frame
      omega: {value: 0, unit: deg}           # fiducial (phase-insensitive)
      epoch: {type: fiducial_phase}          # no observed phase

  b:                           # planet, orbits C
    role: planet
    mass: {value: 5.6, plus: 0.3, minus: 0.3, unit: Mearth}         # M sin i (minimum mass)
    orbit:
      primary: C
      period: {value: 7.1999, unit: day}
      a:     {from: period}
      e:     {value: 0.15, plus: 0.05, minus: 0.05}
      i:     {value: 0, unit: deg, kind: mutual}   # coplanar => 0 in this frame
      Omega: {value: 0, unit: deg}
      omega: {value: 12, unit: deg}
      epoch: {type: periastron_bjd, T0: {value: 2454446.1, unit: BJD}}

  c:
    role: planet
    mass: {value: 4.1, plus: 0.6, minus: 0.6, unit: Mearth}
    orbit:
      primary: C
      period: {value: 28.10, unit: day}
      a:     {from: period}
      e:     {value: 0.27, plus: 0.1, minus: 0.1}
      i:     {value: 0, unit: deg, kind: mutual}
      Omega: {value: 0, unit: deg}
      omega: {value: 140, unit: deg}
      epoch: {type: periastron_bjd, T0: {value: 2454462, unit: BJD}}

experiment:
  active_planets: [b, c]       # GJ 667 always both
  t_ref_bjd: 2454446.1         # single common epoch to phase everything to
  dt: {type: minimum_period}
  integration: {tspan_yr: 1.0e+7, out_cadence_yr: 100}