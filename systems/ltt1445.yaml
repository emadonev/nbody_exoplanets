system: LTT1445
# Canonical internal units after loading: AU, year, M_sun, radian.
reference_frame: sky           # measured sky inclination

bodies:
  C:
    role: inner_primary
    mass: {value: 0.161, plus: 0.014, minus: 0.014, unit: Msun}
    luminosity: {value: 0.00368, unit: Lsun}
  B:                         
    role: inner_secondary
    mass: {value: 0.215, plus: 0.014, minus: 0.014, unit: Msun}
    luminosity: {value: 0.00596, unit: Lsun}

    orbit:
      primary: C
      a: {value: 8.1, unit: AU}
      e: {value: 0.50}
      i: {value: 89.64, unit: deg, kind: sky}
      Omega: {value: 137.63, unit: deg}
      omega: {value: 209, unit: deg}
      epoch: {type: periastron_besselian, T0: {value: 2019.2, unit: Byr}}


  A:
    role: host
    mass: {value: 0.257, plus: 0.014, minus: 0.014, unit: Msun}
    luminosity: {value: 0.00794, unit: Lsun}

    orbit:                     # A relative to BC barycentre
      primary: [B, C]
      a: {value: 63.45, unit: AU}
      e: {value: 0.4}
      i: {value: 88.82, unit: deg, kind: sky}
      Omega: {value: 135.10, unit: deg}
      omega: {value: 247.52, unit: deg}
      epoch:
        type: mean_longitude   # M(t_ref) = lambda_ref - omega  (NOT -Omega-omega)
        lambda_ref: {value: 211.19, unit: deg}
        t_ref: {value: 2455197.5, unit: JD}

  b: 
    {role: planet, 
    mass: {value: 2.32, plus: 0.25, minus: 0.25, unit: Mearth}, 
    orbit: {
      primary: A, 
      period: {value: 5.358765, unit: day},
      a: {from: period}, 
      e: {value: 0.18, plus: 0.07, minus: 0.06},
      i: {value: 88.95, unit: deg, kind: sky}, 
      Omega: {value: 0, unit: deg},
      omega: {value: 4.25, unit: rad},
      epoch: {type: inferior_conjunction_bjd, T0: {value: 2458423.426378, unit: BJD}}}}

  c: 
    {role: planet, 
    mass: {value: 1.00, plus: 0.19, minus: 0.19, unit: Mearth}, 
    orbit: {
      primary: A, 
      period: {value: 3.123898, unit: day},
      a: {from: period}, 
      e: {value: 0.05, plus: 0.05, minus: 0.03},
      i: {value: 86.5, unit: deg, kind: sky}, 
      Omega: {value: 0, unit: deg},
      omega: {value: 2.84, unit: rad},
      epoch: {type: inferior_conjunction_bjd, T0: {value: 2458425.078182, unit: BJD}}}}

  d: 
    {role: planet, 
    mass: {value: 2.72, plus: 0.75, minus: 0.75, unit: Mearth}, 
    orbit: {
      primary: A, 
      period: {value: 24.29, unit: day},
      a: {from: period},
      e: {value: 0.26, plus: 0.14, minus: 0.13}, 
      i: {value: 89, kind: sky, unit: deg}, 
      Omega: {value: 0, unit: deg}, 
      omega: {value: 0.88, unit: rad},
      epoch: {type: inferior_conjunction_bjd, T0: {value: 2458440.09, unit: BJD}}}}

experiment:
  t_ref_bjd: 2458423.426378
  dt: {type: minimum_period}
  integration: {tspan_yr: 1.0e+7, out_cadence_yr: 100}
  sets:
    - {name: two_planet,   active_planets: [b, c]}
    - {name: three_planet, active_planets: [b, c, d]}
